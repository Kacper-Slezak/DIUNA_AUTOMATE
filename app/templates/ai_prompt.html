<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dune: Imperium - Prompt AI</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        textarea { width: 100%; height: 60vh; padding: 10px; box-sizing: border-box; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #009688; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #00796b; }
    </style>
</head>
<body>
    <h1>Gotowy Prompt dla AI (<span style="color: blue;">{{ ai_player_name }}</span>)</h1>
    <p>Skopiuj poniższy tekst i wklej go do swojego modelu AI, aby **{{ ai_player_name }}** wykonał ruch.</p>
    
    <textarea id="promptTextarea" rows="30" cols="100" readonly>{{ prompt_text }}</textarea>
    
    <p><button onclick="copyToClipboard()">Skopiuj do Schowka</button></p>
    <p><a href="{{ url_for('index') }}">Powrót do Asystenta Ruchów</a></p>
    
    <script>
        function copyToClipboard() {
            var copyText = document.getElementById("promptTextarea");
            copyText.select();
            copyText.setSelectionRange(0, 99999); // Dla urządzeń mobilnych
            document.execCommand("copy");
            alert("Prompt został skopiowany do schowka!");
        }
    </script>
</body>
</html>
